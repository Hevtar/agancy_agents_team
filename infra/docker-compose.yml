version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: agency_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agency_db}
      POSTGRES_USER: ${POSTGRES_USER:-agency_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agency_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - agency_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agency_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Celery and Event Bus
  redis:
    image: redis:7-alpine
    container_name: agency_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - agency_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ChromaDB for Knowledge Base
  chromadb:
    image: chromadb/chroma:latest
    container_name: agency_chromadb
    environment:
      CHROMA_DB_IMPL: chromadb.db.impl.sqlite
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: 8000
    volumes:
      - chromadb_data:/chroma/chroma
    ports:
      - "8000:8000"
    networks:
      - agency_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Application
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: agency_api
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-false}
      POLZA_AI_API_KEY: ${POLZA_AI_API_KEY}
      POLZA_AI_BASE_URL: ${POLZA_AI_BASE_URL:-https://polza.ai/api/v1}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: 8000
    volumes:
      - ../knowledge_base:/app/knowledge_base
      - ../logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    networks:
      - agency_network

  # Celery Worker
  celery_worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: agency_celery_worker
    command: celery -A core.celery_app worker --loglevel=info --concurrency=4
    environment:
      APP_ENV: ${APP_ENV:-development}
      POLZA_AI_API_KEY: ${POLZA_AI_API_KEY}
      POLZA_AI_BASE_URL: ${POLZA_AI_BASE_URL:-https://polza.ai/api/v1}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: 8000
    volumes:
      - ../knowledge_base:/app/knowledge_base
      - ../logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    networks:
      - agency_network

  # Celery Beat (Scheduler)
  celery_beat:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: agency_celery_beat
    command: celery -A core.celery_app beat --loglevel=info
    environment:
      APP_ENV: ${APP_ENV:-development}
      POLZA_AI_API_KEY: ${POLZA_AI_API_KEY}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      CHROMADB_HOST: chromadb
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agency_network

  # Prometheus for Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: agency_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - agency_network

  # Grafana for Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: agency_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - agency_network

volumes:
  postgres_data:
  redis_data:
  chromadb_data:
  prometheus_data:
  grafana_data:

networks:
  agency_network:
    driver: bridge